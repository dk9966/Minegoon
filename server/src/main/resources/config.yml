helper:
  name: Builder

openrouter:
  # Paste the key here on the server only. "get 5 diamond" and the other
  # commands work with or without a key. With a key, a sentence that names the
  # helper goes to the desk model, which answers it, acts on it at once, or
  # starts a mission: the planner model writes a plan, then the helper works
  # through it one tool at a time, with the desk model taking the turns that
  # go to plan. When a search keeps coming up empty the advice model is asked
  # once where to look; good advice is kept in lessons.json. Without a key,
  # the helper searches with what it knows.
  api-key: ""
  planner-model: anthropic/claude-opus-5.5
  desk-model: google/gemini-3.8-flash
  advice-model: google/gemini-3.8-flash
  fallback-model: anthropic/claude-opus-5.5

# How much one mission may use before it stops and says why.
agent:
  max-turns: 40
  max-strong-calls: 12
  max-minutes: 90

# Practice server only: enables /minegoon reset and spar.
lab: false

# Lab suite only. Each name is its own copy of the world, with its own helper,
# sharing this one server. Leave the list empty on a server people play on.
lanes: []
